services:
  # Always started -- registration with the registry is mandatory (see
  # BasyxClient.upload / `just basyx-upload`), and the AAS Web UI itself
  # fetches from AAS_REGISTRY_PATH on load, so it 500s/"Failed to fetch"
  # without this running.
  aas-registry:
    image: eclipsebasyx/aas-registry-log-mem:2.0.0-SNAPSHOT
    container_name: asset-forge-aas-registry
    ports:
      - "${AAS_REGISTRY_PORT:-8082}:8080"
    environment:
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
    restart: unless-stopped

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-SNAPSHOT
    container_name: asset-forge-aas-environment
    depends_on:
      - aas-registry
    ports:
      - "${AAS_ENV_PORT:-8081}:8081"
    environment:
      # Note: confirmed (in the reference project this pipeline's BaSyx
      # client was informed by) that these env vars alone do NOT make the
      # server auto-register descriptors on upload -- BasyxClient.upload()
      # registers them explicitly itself. Left set anyway since it's
      # otherwise harmless and documents the intended registry pairing.
      - BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION=http://aas-registry:8080/shell-descriptors
      - BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION=http://aas-registry:8080/submodel-descriptors
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
      # Spring Boot's multipart defaults (~1MB/file) are way too small for a
      # real plant's .aasx -- confirmed live: digihub_building's 5.7MB
      # package 413'd ("MaxUploadSizeExceededException") until these were
      # raised. 200MB comfortably covers plants larger than the ones in
      # assets/ today.
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=200MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=200MB
    restart: unless-stopped

  aas-web-ui:
    image: eclipsebasyx/aas-gui:latest
    container_name: asset-forge-aas-web-ui
    ports:
      - "${AAS_UI_PORT:-3000}:3000"
    environment:
      # Read client-side by the browser, so these need to be reachable as
      # "localhost:<port>" from the host, not the in-network service names.
      - BASE_PATH=/
      - ALLOW_EDITING=true
      - ALLOW_UPLOADING=true
      - AAS_REGISTRY_PATH=http://localhost:${AAS_REGISTRY_PORT:-8082}/shell-descriptors
      - AAS_REPO_PATH=http://localhost:${AAS_ENV_PORT:-8081}/shells
      - SUBMODEL_REPO_PATH=http://localhost:${AAS_ENV_PORT:-8081}/submodels
    depends_on:
      - aas-environment
      - aas-registry
    restart: unless-stopped

  # Bridges an external OPC UA server's sensor writes into this plant's AAS
  # `opcua` submodels -- config-only (see infra/databridge/*.json, generated
  # by `asset-forge convert`'s --databridge flag / export/aas/databridge.py),
  # no code of its own. The OPC UA server itself (the mock sensor service)
  # is out of scope for this repo; OPCUA_HOST/OPCUA_PORT below just need to
  # point at wherever it ends up running.
  databridge:
    image: eclipsebasyx/databridge:1.0.0-SNAPSHOT
    container_name: asset-forge-databridge
    ports:
      - "${DATABRIDGE_PORT:-8085}:8085"
    volumes:
      - ./databridge:/usr/share/config
    depends_on:
      - aas-environment
    restart: unless-stopped

  # Real historized storage for sensor readings -- the `timeseries`
  # submodel's LinkedSegment.Query (see export/aas/submodels.py) points
  # Flux queries here. Deliberately separate from BaSyx itself: BaSyx's own
  # aas-environment only ever holds the *current* value of a Property (see
  # its module docstring in submodels.py) regardless of backend, never a
  # history -- this is the actual retention layer. A named volume is
  # required (not optional) here, unlike the other services: the whole
  # point of adding this was to survive restarts, so data loss on
  # `docker compose down` would defeat the purpose.
  influxdb:
    image: influxdb:2.7
    container_name: asset-forge-influxdb
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=asset-forge
      - DOCKER_INFLUXDB_INIT_PASSWORD=asset-forge-dev
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-asset-forge}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensors}
      # Fixed (not auto-generated) so config.py's own default matches it
      # without needing to fetch/extract a generated token -- local dev
      # stack only, not a secret worth protecting here.
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-asset-forge-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  # Intermediary in front of InfluxDB (see history_api.py): the `timeseries`
  # submodel's LinkedSegment.Query only ever holds a plain asset id, never a
  # raw Flux string -- a consumer calls this service's own small HTTP API
  # with that id instead. Build context is the repo root (not this
  # directory) so its Dockerfile can copy src/asset_forge/{config,history_api}.py.
  history-api:
    build:
      context: ..
      dockerfile: infra/history-api/Dockerfile
    container_name: asset-forge-history-api
    ports:
      - "${HISTORY_API_PORT:-8090}:8090"
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:-asset-forge}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-asset-forge-dev-token}
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb-data:
