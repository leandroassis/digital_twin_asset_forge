[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-forge"
version = "0.1.0"
description = "Multi-source IFC ingestion, DEXPI/AAS conversion and BaSyx upload pipeline"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ifcopenshell==0.8.5",
    "basyx-python-sdk==2.1.0",
    "pyDEXPI==1.2.0",
    "networkx>=3.6",
    "typer>=0.27",
    "rich>=13",
    "loguru>=0.7",
    "requests>=2.31",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
asset-forge = "asset_forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
